<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Nicole Dale Ramos</title>
<meta name="robots" content="noindex">

<!-- ═════════════════════════════════════════════════════════════════
     This page is deliberately SELF-CONTAINED — its CSS is inlined and
     it loads no stylesheet, favicon or script.

     Why: GitHub Pages serves this file for ANY missing URL at ANY depth
     (/a/b/c/nope). A relative path like css/styles.css would resolve
     against that fake depth and 404, leaving visitors an unstyled page.
     Inlining removes the dependency entirely, and the page is small
     enough that the duplication costs nothing.

     Trade-off: restyling the main site won't update this page. For a
     page nobody should see twice that's the right trade — but if you
     change --accent in css/styles.css, change it here too.
     ══════════════════════════════════════════════════════════ -->
<style>
  :root {
    --accent: hsl(172 62% 32%);
    --bg: #fbfaf8; --text: #1a1a19; --text-mid: #55534e;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-display: Georgia, 'Times New Roman', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --accent: hsl(172 55% 62%); --bg: #14151a; --text: #eceaf0; --text-mid: #a9a7b2;
    }
  }
  :root[data-theme='dark'] {
    --accent: hsl(172 55% 62%); --bg: #14151a; --text: #eceaf0; --text-mid: #a9a7b2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; text-align: center;
    padding: 2rem 1.5rem;
    background: var(--bg); color: var(--text);
    font-family: var(--font-sans); line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .code {
    margin: 0; line-height: 1; color: var(--accent);
    font-family: var(--font-display); font-size: clamp(4rem, 14vw, 8rem);
    letter-spacing: -.03em; font-weight: 600;
  }
  h1 {
    margin: .35em 0 .5em; font-weight: 600; letter-spacing: -.02em;
    font-family: var(--font-display); font-size: clamp(1.5rem, 4vw, 2.2rem);
  }
  p.msg { color: var(--text-mid); max-width: 40ch; margin: 0 auto; }
  .btn {
    display: inline-block; margin-top: 1.75rem;
    padding: .7rem 1.35rem; border-radius: 999px;
    background: var(--accent); color: #fff; text-decoration: none;
    font-size: .925rem; font-weight: 500;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .btn { color: #14151a; } }
  :root[data-theme='dark'] .btn { color: #14151a; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
<script>
  /* Match the theme the visitor picked on the main site. */
  try {
    var t = localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page doesn't exist.</h1>
    <p class="msg">The link may be out of date, or I may have moved something. Either way, the front page is a good place to restart.</p>
    <!-- "/" is correct for a user site (username.github.io) and stays
         correct if a custom domain is attached later — both serve at root. -->
    <p><a class="btn" href="/">Back to the homepage</a></p>
  </main>
</body>
</html>
